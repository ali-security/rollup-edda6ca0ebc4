name: Tests

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional mocha --grep pattern to run a subset of tests'
        required: false
        default: ''

jobs:
  linux16:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Node 16 + Coverage (Linux)
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '16'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests with coverage
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build:cjs && npm run build:bootstrap && npx mocha test/test.js --grep "${{ inputs.test-filter }}"
          else
            npm run ci:coverage
          fi
        shell: bash
        env:
          CI: true

  linux14:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Node 14 + Extra Tests (Linux)
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: '14'
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run all tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build:cjs && npm run build:bootstrap && npx mocha test/test.js --grep "${{ inputs.test-filter }}"
          else
            npm run ci:test
          fi
        shell: bash
        env:
          CI: true
      - name: Pack release tarball
        run: |
          printf '%s' 030c56fd6b186a0ddfd57d143ad703f34fd2c17a > .commithash
          npm run build:cjs && npm run build:bootstrap
          npm pack --ignore-scripts
        env:
          SOURCE_DATE_EPOCH: '1649999661'
      - name: Upload release tarball
        uses: actions/upload-artifact@v4
        with:
          name: rollup-tgz
          path: rollup-*.tgz
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node: ['10', '12', '17']
    name: Node ${{ matrix.node }} (Linux)
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build:cjs && npm run build:bootstrap && npx mocha test/test.js --grep "${{ inputs.test-filter }}"
          else
            npm run ci:test:only
          fi
        shell: bash
        env:
          CI: true

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node: ['12', '16']
        exclude:
          - node: '12'
    name: Node ${{ matrix.node }} (macOS)
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build:cjs && npm run build:bootstrap && npx mocha test/test.js --grep "${{ inputs.test-filter }}"
          else
            npm run ci:test:only
          fi
        shell: bash
        env:
          CI: true

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      matrix:
        node: ['10', '16']
    name: Node ${{ matrix.node }} (Windows)
    steps:
      - name: Checkout Commit
        uses: actions/checkout@v2
      - name: Setup Node
        uses: actions/setup-node@v2
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run tests
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            npm run build:cjs && npm run build:bootstrap && npx mocha test/test.js --grep "${{ inputs.test-filter }}"
          else
            npm run ci:test:only
          fi
        shell: bash
        env:
          CI: true
